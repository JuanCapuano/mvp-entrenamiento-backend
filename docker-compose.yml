services:
  mysql:
    image: mysql:8.4
    container_name: mvp-entrenamiento-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - '${DB_PORT}:3306'
    volumes:
      - ./mysql:/var/lib/mysql
